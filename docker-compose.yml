services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cas_backend
    restart: unless-stopped
    volumes:
      - sqlite_data:/app/data
      - static_volume:/app/staticfiles
      - ./media:/app/media
    environment:
      - DEBUG=False
      - SQLITE_DIR=/app/data
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-cas-exam-production-secret-key-301students}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-cas.atleelabs.tech,www.cas.atleelabs.tech,136.64.188.177,localhost,127.0.0.1,backend,nginx}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://cas.atleelabs.tech,http://cas.atleelabs.tech,https://www.cas.atleelabs.tech,http://www.cas.atleelabs.tech,http://136.64.188.177,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-Atlee}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-IKnowYourLie@1502}
      - STUDENT_PASSWORD=${STUDENT_PASSWORD:-StudentPass123!}
    expose:
      - "8000"

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: cas_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - static_volume:/usr/share/nginx/static:ro
      - ./media:/usr/share/nginx/media:ro
    depends_on:
      - backend

  certbot:
    image: certbot/certbot:latest
    container_name: cas_certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    depends_on:
      - nginx

volumes:
  sqlite_data:
  static_volume:
  certbot_conf:
  certbot_www:
